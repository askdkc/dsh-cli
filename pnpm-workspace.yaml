packages:
  - 'vendor/dsh-std/packages/core'
  - 'vendor/dsh-std/packages/manifest'
  - 'vendor/dsh-std/packages/connection'
  - 'vendor/dsh-std/packages/presentation'
  - 'vendor/dsh-std/packages/command'
  - 'vendor/dsh-std/packages/storage'
  - 'vendor/dsh-std/packages/messages'
  - 'vendor/sqlite-island'
  - 'vendor/dsh-working-activity'

# Host packages are explicit dev dependencies; never synthesize another host from peers.
autoInstallPeers: false

# DSH releases are selected by the lockfile; do not override the host dependency graph.
overrides:
  # Develop the public alias against the local fork until it is published.
  dsh-working-activity: link:vendor/dsh-working-activity
  # Upstream dropped the sqlite backend at 0.1.2-alpha.3; rc.2 stays as a
  # dev-only exact pin because scripts/migrate-sessions-to-jsonl.mts still
  # reads the retired cc-tui SQLite store through it. Never a peer.
  #
  # It lives behind the vendor/sqlite-island wrapper package: 0.1.5 removed
  # exports the rc.2 build links against (DEFAULT_PREPARED_SESSION_CACHE_SIZE,
  # PersistenceCoordinator, …), and the blanket overrides above would force
  # the incompatible 0.1.5 copies into its peer slots — pnpm resolves a
  # root-level dependency's peers from the ROOT context, so an override
  # selector on the sqlite package itself cannot reach them. Inside the
  # wrapper's subtree the peers resolve from the wrapper's own dependency
  # list, and these selector overrides pin that closure at 0.1.1-rc.2
  # (persistence → session → llm → brand/timeout/scope/typert-protocol/
  # attachment/invariants, all peer-only packages) without touching the
  # primary 0.1.5 tree.
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-session-persistence-sqlite': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-session-persistence': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-session': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-llm': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-invariants': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-brand': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-timeout': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-scope': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-typert-protocol': 0.1.1-rc.2
  '@dsh-tui-dev/sqlite-island>@deepseek-ai/dsh-attachment': 0.1.1-rc.2
  # OpenCode model list: force the pi-ai catalog past dsh-llm-pi-ai's
  # ^0.87.1 pin to the latest verified list (0.99.1: 77 chat models +
  # classifiers, clean IDs — the `chat:`/`classifier:` prefixes live only
  # in JSON keys and are stripped from model.id).
  '@earendil-works/pi-ai': 0.99.1

allowBuilds:
  # Optional postinstall-only (pi-ai transitive deps): nothing at runtime
  # needs their build scripts.
  '@google/genai': false
  esbuild: false
  koffi: false
  protobufjs: false
minimumReleaseAgeExclude:
  # Prerelease adaptation: the current cohort can be younger than
  # pnpm 11's default 24h minimumReleaseAge; exempt the whole scope
  # (rollup R-08 recommends per-scope exemption over disabling; name
  # patterns cannot carry a version spec here).
  - '@deepseek-ai/*'
  - '@deepseek-ai/cordis-plugin-include@1.0.6'
  - '@deepseek-ai/cordis-plugin-loader@1.0.2'
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  - '@deepseek-ai/schemastery@3.18.1'
  - dsh-working-activity@0.2.6 || 0.3.0 || 0.3.2 || 0.3.3 || 0.4.0 || 0.5.0
  # pi-ai 0.99.1 rides with @earendil-works/pi-telemetry@0.99.1, which trips
  # the default 24h minimumReleaseAge until 2026-09-30T18:17Z; exempt the
  # whole (tiny, exact-pinned) scope like @deepseek-ai/* above so future
  # pi-ai bumps do not need a paired exemption each time.
  - '@earendil-works/*'
