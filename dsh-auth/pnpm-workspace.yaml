allowBuilds:
  # Optional postinstall-only helpers (pi-ai transitive deps): nothing at
  # runtime needs their build scripts; refusing keeps installs hermetic.
  '@google/genai': false
  protobufjs: false

autoInstallPeers: false

# Preserve the independent provider catalog override; DSH follows the manifest channel.
overrides:
  # OpenCode model list: force the pi-ai catalog past dsh-llm-pi-ai's
  # ^0.87.1 pin to the latest verified list (0.99.1). Mirrors the parent
  # repo override; dsh-auth installs from its own directory.
  '@earendil-works/pi-ai': 0.99.1

# Prereleases can be younger than pnpm 11 default 24h minimumReleaseAge;
# exempt the whole scope (name patterns cannot carry a version spec).
# @earendil-works/* covers pi-ai plus its pi-telemetry companion pin.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  - '@earendil-works/*'
  # Exact SDK versions selected and fixture-tested for the owned OpenCode
  # transports, including their lockfile-pinned provider-utils dependency.
  # Keep the default 24h gate for every other version; do not exempt @ai-sdk/*.
  - '@ai-sdk/anthropic@4.0.71'
  - '@ai-sdk/google@4.0.87'
  - '@ai-sdk/openai-compatible@3.0.62'
  - '@ai-sdk/openai@4.0.83'
  - '@ai-sdk/provider-utils@5.0.53'
  - '@ai-sdk/provider@4.0.21'
